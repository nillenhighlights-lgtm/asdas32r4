<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spotify Runner Fix</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --green: #1DB954;
            --black: #121212;
        }

        body {
            margin: 0;
            background: var(--black);
            color: white;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 2/1;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 14px;
            color: var(--green);
        }

        #menu {
            position: absolute;
            inset: 0;
            background: rgba(18, 18, 18, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .btn {
            background: var(--green);
            color: black;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">
        <div id="score">SCORE: 0</div>
        <div id="best">BEST: 0</div>
    </div>

    <div id="menu">
        <h1 id="title">SPOTIFY RUN</h1>
        <p style="color: #b3b3b3" id="subtitle">Жми на экран, чтобы прыгать</p>
        <button class="btn" onclick="initGame()">ИГРАТЬ</button>
    </div>

    <canvas id="canvas"></canvas>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const menu = document.getElementById('menu');

    // Настройки
    canvas.width = 800;
    canvas.height = 400;

    let isPlaying = false;
    let score = 0;
    let best = localStorage.getItem('best_score') || 0;
    bestEl.innerText = `BEST: ${best}`;

    const player = {
        x: 100,
        y: 300,
        r: 25,
        v: 0,
        jump: -13,
        grav: 0.7,
        onGround: false,

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            // Кружок
            ctx.fillStyle = '#1DB954';
            ctx.beginPath();
            ctx.arc(0, 0, this.r, 0, Math.PI * 2);
            ctx.fill();

            // Полоски внутри
            ctx.strokeStyle = '#121212';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            for(let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.arc(0, 8 - i*6, 18 - i*5, Math.PI * 1.2, Math.PI * 1.8);
                ctx.stroke();
            }
            ctx.restore();
        },

        update() {
            this.v += this.grav;
            this.y += this.v;

            const ground = canvas.height - 50 - this.r;
            if (this.y > ground) {
                this.y = ground;
                this.v = 0;
                this.onGround = true;
            } else {
                this.onGround = false;
            }
            this.draw();
        }
    };

    let obstacles = [];
    let obsTimer = 0;

    class Obstacle {
        constructor() {
            this.x = canvas.width + 50;
            this.count = Math.random() > 0.5 ? 2 : 1; // 1 или 2 палки
            this.w = 12; // ширина палочки
            this.h = 40 + Math.random() * 60; // высота
            this.gap = 10; // расстояние между двумя палками
        }

        draw() {
            ctx.fillStyle = '#FFFFFF';
            // Рисуем палочки
            for (let i = 0; i < this.count; i++) {
                const posX = this.x + (i * (this.w + this.gap));
                ctx.beginPath();
                ctx.roundRect(posX, canvas.height - 50 - this.h, this.w, this.h, 5);
                ctx.fill();
            }
        }

        update(speed) {
            this.x -= speed;
            this.draw();
        }

        checkCol() {
            // Упрощенная проверка столкновения для палок
            const totalWidth = this.count * (this.w + this.gap);
            if (player.x + player.r - 5 > this.x && 
                player.x - player.r + 5 < this.x + totalWidth &&
                player.y + player.r - 5 > canvas.height - 50 - this.h) {
                return true;
            }
            return false;
        }
    }

    function initGame() {
        score = 0;
        obstacles = [];
        player.y = 300;
        player.v = 0;
        isPlaying = true;
        menu.style.display = 'none';
        scoreEl.innerText = `SCORE: 0`;
        animate();
    }

    function gameOver() {
        isPlaying = false;
        tg.HapticFeedback.notificationOccurred('error');
        if (score > best) {
            best = score;
            localStorage.setItem('best_score', best);
            bestEl.innerText = `BEST: ${best}`;
        }
        document.getElementById('title').innerText = "TRACK PAUSED";
        document.getElementById('subtitle').innerText = `Твой счет: ${score}`;
        menu.style.display = 'flex';
    }

    let speed = 7;

    function animate() {
        if (!isPlaying) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Пол
        ctx.strokeStyle = '#282828';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height - 50);
        ctx.lineTo(canvas.width, canvas.height - 50);
        ctx.stroke();

        player.update();

        // Спавн палок
        obsTimer++;
        if (obsTimer > Math.max(60, 100 - score/10)) {
            obstacles.push(new Obstacle());
            obsTimer = 0;
        }

        obstacles.forEach((obs, i) => {
            obs.update(speed + score / 500);
            if (obs.checkCol()) gameOver();
            if (obs.x < -100) {
                obstacles.splice(i, 1);
                score += 10;
                scoreEl.innerText = `SCORE: ${score}`;
            }
        });

        requestAnimationFrame(animate);
    }

    // УПРАВЛЕНИЕ - Работает на тач и клик
    function triggerJump(e) {
        if (e) e.preventDefault();
        if (isPlaying && player.onGround) {
            player.v = player.jump;
            tg.HapticFeedback.impactOccurred('light');
        }
    }

    window.addEventListener('touchstart', triggerJump, { passive: false });
    window.addEventListener('mousedown', (e) => {
        if (e.target.tagName !== 'BUTTON') triggerJump();
    });
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') triggerJump();
    });

</script>
</body>
</html>
