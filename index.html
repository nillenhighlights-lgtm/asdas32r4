<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spotify Run Pro: Музыкальная гонка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --sp-green: #1DB954;
            --sp-black: #121212;
            --sp-dark-grey: #212121;
            --sp-light-grey: #b3b3b3;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--sp-black);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        .stats-container {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--sp-light-grey);
        }

        #score-val, #high-score-val {
            color: var(--sp-green);
            font-weight: bold;
            font-size: 18px;
        }

        canvas {
            width: 100%;
            max-width: 600px;
            aspect-ratio: 2/1;
            image-rendering: -webkit-optimize-contrast;
        }

        #overlay {
            position: absolute;
            background: rgba(18, 18, 18, 0.85);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .btn {
            background: var(--sp-green);
            color: black;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            pointer-events: auto;
            transition: transform 0.1s;
        }

        .btn:active { transform: scale(0.95); }

        .game-title {
            font-size: 24px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="stats-container">
            <div>Score: <span id="score-val">0</span></div>
            <div>Best: <span id="high-score-val">0</span></div>
        </div>
    </div>

    <div id="overlay">
        <div class="game-title">Spotify Runner</div>
        <div style="color: var(--sp-light-grey); font-size: 14px;">Держи ритм, перепрыгивай шумы и ноты!</div>
        <button class="btn" onclick="startGame()">ИГРАТЬ</button>
    </div>

    <canvas id="game"></canvas>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.setHeaderColor('#121212');

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score-val');
    const highScoreDisplay = document.getElementById('high-score-val');
    const overlay = document.getElementById('overlay');

    function resize() {
        canvas.width = 600;
        canvas.height = 300;
    }
    resize();

    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let score = 0;
    let highScore = localStorage.getItem('sp-high-score') || 0;
    let gameSpeed = 4.5;
    let frames = 0;
    highScoreDisplay.innerText = highScore;

    const gravity = 0.5;

    // --- ПРЕЛОАД ОБЛОЖЕК АЛЬБОМОВ ---
    const albumUrls = [
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR8gBZ1lS3ve1PNQzXIXCKg2G7udJJf3EfqQg&s",
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRzWmPfr18SQ4tUzVw9WRfFmnNUZTZknO0JfA&s",
        "https://upload.wikimedia.org/wikipedia/en/0/03/Yeezus_album_cover.png", // Заменил вики-ссылку на прямую картинку
        "https://the-flow.ru/uploads/images/catalog/element/674ed908c6641.jpg",
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRnPdihXAp9x03MtNbFYV0gcWLiYfx3O8vbSA&s",
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTSu6yJaWPq17zZ7TFm9yeBlW7M7Qjnegbtqw&s",
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTGtPT8TMsDZy4LTFLKQTs9ibT48aWX7yNcqQ&s",
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSXb3zzq2Q8V-8txGocR-g40tBe_YP9MLsAyQ&s",
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRsoJ-5SGqVZDuYgrxJ9EtVKr1-KfbbxAVZIA&s",
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRiHSXAV9bLn_Qj-kV8CAXbkOJYGn8n-M0k-Q&s"
    ];

    const preloadedAlbums = [];
    albumUrls.forEach(url => {
        const img = new Image();
        img.crossOrigin = "Anonymous"; // На всякий случай для CORS
        img.src = url;
        preloadedAlbums.push(img);
    });
    // --------------------------------

    // Частицы при взрыве
    let particles = [];
    class Particle {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 4 + 2;
            this.speedX = (Math.random() - 0.5) * 8;
            this.speedY = (Math.random() - 0.5) * 8;
            this.life = 1;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.02;
        }
        draw() {
            ctx.fillStyle = `rgba(29, 185, 84, ${this.life})`;
            ctx.fillRect(this.x, this.y, this.size, this.size);
        }
    }

    const player = {
        x: 80,
        y: 200,
        r: 20,
        dy: 0,
        jumpPower: -11,
        grounded: false,
        angle: 0,

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            // Лёгкий фирменный наклон
            ctx.rotate(this.angle + 0.25);

            // Тень
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#1DB954';

            // Круг (фон Spotify)
            ctx.beginPath();
            ctx.arc(0, 0, this.r, 0, Math.PI * 2);
            ctx.fillStyle = '#1DB954';
            ctx.fill();

            // Настройки линий
            ctx.strokeStyle = '#121212';
            ctx.lineCap = 'round';

            // --- Волны Spotify ---
            // Верхняя
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(-4, -2, 16, Math.PI * 1.2, Math.PI * 1.9);
            ctx.stroke();

            // Средняя
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(-4, 4, 12, Math.PI * 1.2, Math.PI * 1.9);
            ctx.stroke();

            // Нижняя
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(-4, 9, 8, Math.PI * 1.2, Math.PI * 1.9);
            ctx.stroke();

            ctx.restore();
            ctx.shadowBlur = 0;
        },

        update() {
            this.dy += gravity;
            this.y += this.dy;

            if (this.y >= 250) {
                this.y = 250;
                this.dy = 0;
                this.grounded = true;
            } else {
                this.grounded = false;
            }
            
            if (!this.grounded) this.angle += 0.1;
            else this.angle = 0;
            
            this.draw();
        }
    };

    // Базовый класс для препятствий
    class Obstacle {
        constructor() {
            this.x = canvas.width + 100;
            this.textureSeed = Math.random() * 1000;
        }
        draw() {} // Override in subclass
        update() {
            this.x -= gameSpeed;
            this.draw();
        }
    }

    // Препятствие: Блок шума
    class GroundBlockObstacle extends Obstacle {
        constructor() {
            super();
            this.w = 20 + Math.random() * 20;
            this.h = 40 + Math.random() * 50;
            this.y = 260 - this.h;
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            let gradient = ctx.createLinearGradient(0, 0, 0, this.h);
            gradient.addColorStop(0, '#555555');
            gradient.addColorStop(1, '#FFFFFF');
            ctx.fillStyle = gradient;
            
            ctx.beginPath();
            ctx.roundRect(0, 0, this.w, this.h, 5);
            ctx.fill();
            
            ctx.fillStyle = `rgba(0, 0, 0, 0.2)`;
            for(let k=0; k<10; k++) {
                ctx.fillRect(Math.random()*this.w, Math.random()*this.h, 2, 2);
            }
            ctx.restore();
        }
    }

    // Препятствие: Нота
    class GroundNoteObstacle extends Obstacle {
        constructor() {
            super();
            this.w = 30;
            this.h = 50;
            this.y = 260 - this.h;
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.fillStyle = 'white';
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
            
            ctx.fillRect(20, 0, 5, 40);
            
            ctx.beginPath();
            ctx.ellipse(10, 40, 10, 7, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(25, 0);
            ctx.lineTo(25, 10);
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'white';
            ctx.stroke();
            
            ctx.restore();
            ctx.shadowBlur = 0;
        }
    }

    // Препятствие: Альбом (КАСТОМНЫЙ)
    class FlyingAlbumObstacle extends Obstacle {
        constructor() {
            super();
            this.w = 60;
            this.h = 60;
            this.y = (Math.random() < 0.5) ? 150 : 80;
            
            // Берем случайную прелоаднутую картинку
            this.albumImage = preloadedAlbums[Math.floor(Math.random() * preloadedAlbums.length)];
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            // Тень
            ctx.shadowBlur = 15;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
            
            // Создаем маску для закругленных краев
            ctx.beginPath();
            ctx.roundRect(0, 0, this.w, this.h, 10);
            ctx.clip(); // Обрезаем всё, что выходит за рамки скругленного квадрата
            
            // Рисуем картинку, если она успела загрузиться
            if (this.albumImage && this.albumImage.complete && this.albumImage.naturalWidth !== 0) {
                ctx.drawImage(this.albumImage, 0, 0, this.w, this.h);
            } else {
                // Заглушка, если вдруг картинка битая или еще грузится
                ctx.fillStyle = '#b3b3b3';
                ctx.fill();
            }

            ctx.restore();
        }
    }

    let obstacles = [];

    function startGame() {
        gameState = 'PLAYING';
        overlay.style.display = 'none';
        score = 0;
        gameSpeed = 4.5;
        obstacles = [];
        particles = [];
        player.y = 200;
        player.dy = 0;
        loop();
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
        
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('sp-high-score', highScore);
            highScoreDisplay.innerText = highScore;
        }
        
        for(let i=0; i<15; i++) particles.push(new Particle(player.x, player.y));
        
        setTimeout(() => {
            overlay.style.display = 'flex';
            overlay.querySelector('.game-title').innerText = 'GAME OVER';
            overlay.querySelector('.btn').innerText = 'ПОВТОРИТЬ';
        }, 1000);
    }

    function loop() {
        if (gameState !== 'PLAYING' && particles.length === 0) return;

        ctx.fillStyle = '#121212';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Линия пола
        ctx.strokeStyle = '#282828';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, 260);
        ctx.lineTo(canvas.width, 260);
        ctx.stroke();

        if (gameState === 'PLAYING') {
            player.update();

            if (frames % 90 === 0) {
                let r = Math.random();
                if (r < 0.4) {
                    obstacles.push(new GroundBlockObstacle());
                } else if (r < 0.7) {
                    obstacles.push(new GroundNoteObstacle());
                } else {
                    obstacles.push(new FlyingAlbumObstacle());
                }
            }
            
            obstacles.forEach((obs, index) => {
                obs.update();
                
                let playerHitRadius = 15;
                if (player.x + playerHitRadius > obs.x && player.x - playerHitRadius < obs.x + obs.w &&
                    player.y + playerHitRadius > obs.y && player.y - playerHitRadius < obs.y + obs.h) {
                    gameOver();
                }

                if (obs.x < -100) obstacles.splice(index, 1);
            });

            frames++;
            if (frames % 5 === 0) {
                score++;
                scoreDisplay.innerText = score;
            }
            gameSpeed += 0.001;
        }

        particles.forEach((p, i) => {
            p.update();
            p.draw();
            if (p.life <= 0) particles.splice(i, 1);
        });

        requestAnimationFrame(loop);
    }

    // Управление
    const jumpAction = () => {
        if (gameState === 'PLAYING') {
            if (player.grounded) {
                player.dy = player.jumpPower;
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            }
        }
    };

    window.addEventListener('keydown', (e) => { if(e.code === 'Space') jumpAction(); });
    window.addEventListener('touchstart', (e) => {
        if (e.target.tagName !== 'BUTTON') {
            e.preventDefault();
            jumpAction();
        }
    }, {passive: false});

</script>
</body>
</html>
